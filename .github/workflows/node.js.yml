# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: EDS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
    - name: Install Packages
      run: npm ci
    - name: Create nasaKey.ts
      run: echo 'export const nasaKey = \{ apiKey: "${{ secrets.NASA_KEY }}" \};' > src/keys/nasaKey.ts
    - name: Create firebaseKey.ts
      run: echo "export const firebaseKey = \{ key: ${{ secrets.FIREBASE_KEY }}, projectID: ${{ secrets.FIREBASE_PROJECT_ID}} \};" > src/keys/firebaseKey.ts
    - name: Build
      run: npm run build  --prod
